spring.application.name=APIgateway

server.port=8080

eureka.client.service-url.defaultZone=http://localhost:8761/eureka

spring.cloud.gateway.server.webmvc.routes[0].id=ProductService
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://ProductService
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/products/**

spring.cloud.gateway.server.webmvc.routes[1].id=UserService
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://UserService
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/users/**

spring.cloud.gateway.server.webmvc.routes[2].id=OrderService
spring.cloud.gateway.server.webmvc.routes[2].uri=lb://OrderService
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/orders/**
